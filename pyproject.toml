[project]
name = "retrieval-gating-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "numpy",
    "python-dotenv",
    "huggingface-hub",
    "sentence-transformers",
    "torch",
    "transformers>=4.41.0,<5.0.0",
    "faiss-cpu",
    "pandas>=3.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
